name: Tofu Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'iac/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: '1.6.0'
  WORKING_DIR: './iac'

jobs:
  tofu-plan:
    name: 'Tofu Plan'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: ${{ env.TF_VERSION }}

    - name: Tofu Format Check
      working-directory: ${{ env.WORKING_DIR }}
      run: tofu fmt -check -recursive

    - name: Tofu Init
      working-directory: ${{ env.WORKING_DIR }}
      run: tofu init
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Tofu Validate
      working-directory: ${{ env.WORKING_DIR }}
      run: tofu validate

    - name: Tofu Plan
      working-directory: ${{ env.WORKING_DIR }}
      run: tofu plan -no-color
      env:
        TF_VAR_db_admin_username: ${{ secrets.DB_ADMIN_USERNAME }}
        TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
        TF_VAR_api_key: ${{ secrets.API_KEY }}
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      continue-on-error: true

    - name: Comment PR with Plan
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `#### Tofu Format and Style 🖌\`${{ steps.fmt.outcome }}\`
          #### Tofu Initialization ⚙️\`${{ steps.init.outcome }}\`
          #### Tofu Validation 🤖\`${{ steps.validate.outcome }}\`
          #### Tofu Plan 📖\`${{ steps.plan.outcome }}\`

          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })